# CNPG operator generates Secret "degreedops-db-app" with keys username, password,
# uri, jdbc-uri, host, port, dbname. The bootstrap script rewrites `uri` from
# postgres:// -> postgresql+asyncpg:// into `degreedops-runtime-secrets`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: degreedops-db
  namespace: degreedops-system
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: deplot
      owner: deplot
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
