apiVersion: apps/v1
kind: Deployment
metadata:
  name: degreedops-demo-frontend
  namespace: degreedops-demo
  labels:
    app: degreedops-demo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: degreedops-demo-frontend
  template:
    metadata:
      labels:
        app: degreedops-demo-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: degreedops-demo-frontend
          image: dgscucorecr01.azurecr.io/degreedops-demo-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes to .next/cache at runtime; leaving root writable
            # is easier than mounting emptyDirs at every cache path.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: degreedops-demo-frontend
  namespace: degreedops-demo
spec:
  type: ClusterIP
  selector:
    app: degreedops-demo-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: degreedops-demo-frontend
  namespace: degreedops-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: internal-gateway
      sectionName: https-degreed-com
  hostnames:
    - degreedops-demo.internal.sbx.degreed.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: degreedops-demo-frontend
          port: 3000
