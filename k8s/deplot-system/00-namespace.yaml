apiVersion: v1
kind: Namespace
metadata:
  name: deplot-system
  labels:
    app.kubernetes.io/name: deplot
    app.kubernetes.io/part-of: deplot
---
apiVersion: v1
kind: LimitRange
metadata:
  name: deplot-defaults
  namespace: deplot-system
spec:
  limits:
    # Backend does synchronous LLM/API calls and can spike; give it headroom.
    - type: Container
      default:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: deplot-quota
  namespace: deplot-system
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    requests.storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deplot-default
  namespace: deplot-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - podSelector: {}
  egress:
    - {}
