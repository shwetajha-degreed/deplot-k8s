# Cluster-scoped because Deplot provisions per-tenant namespaces on demand and
# then creates workloads inside them. A namespaced Role in deplot-system alone
# could not create Namespaces or manage objects across those child namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deplot-controller
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - secrets
      - pods
      - configmaps
      - resourcequotas
      - limitranges
      - serviceaccounts
      - persistentvolumeclaims
      - events
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["*"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "clusters/status"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deplot-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deplot-controller
subjects:
  - kind: ServiceAccount
    name: deplot
    namespace: deplot-system
