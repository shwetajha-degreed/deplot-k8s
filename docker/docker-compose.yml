services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deplot
      POSTGRES_PASSWORD: deplot
      POSTGRES_DB: deplot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
