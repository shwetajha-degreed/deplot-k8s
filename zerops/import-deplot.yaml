project:
  name: deplot
  description: "Deplot AI — Autonomous Platform Engineer"
  corePackage: LIGHT
  tags:
    - deplot
    - hackathon

services:
  - hostname: postgres
    type: postgresql@16
    mode: NON_HA
    priority: 3

  - hostname: cache
    type: valkey@7
    mode: NON_HA
    priority: 2

  - hostname: api
    type: python@3.12
    mode: NON_HA
    enableSubdomainAccess: true
    priority: 1
    zeropsSetup: api

  - hostname: web
    type: nodejs@22
    mode: NON_HA
    enableSubdomainAccess: true
    priority: 1
    zeropsSetup: web
