zerops:
  - setup: api
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install . --target dependencies
      deployFiles:
        - backend/~
        - prompts/
        - templates/
      cache:
        - backend/dependencies
    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /api/v1/health
    run:
      base: python@latest
      envVariables:
        PYTHONPATH: dependencies
        CORS_ORIGINS: "https://web-2a39-3000.prg1.zerops.app"
      ports:
        - port: 8000
          httpSupport: true
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
